name: AI Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ai-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make bootstrap

      - name: AI quality gate
        run: make check-ai
