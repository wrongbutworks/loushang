name: AI Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ai-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make bootstrap

      - name: Ruff
        run: make lint-ai

      - name: Mypy
        run: make typecheck-ai

      - name: AI tests
        run: make test-ai
