name: TUI Render Contract

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tui-render-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make bootstrap

      - name: TUI render contract
        run: make test-tui-render-contract
